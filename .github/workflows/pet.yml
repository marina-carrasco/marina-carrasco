name: pet the cat
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: pet-the-cat
jobs:
  pet:
    if: github.event.issue.title == 'pet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node play.js
      - run: |
          git config user.name "pet-bot"
          git config user.email "pet-bot@users.noreply.github.com"
          git add pets.txt README.md
          git commit -m "🐾 the cat got a pet" || exit 0
          git pull --rebase
          git push
      - run: gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
